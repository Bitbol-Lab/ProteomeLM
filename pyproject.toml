[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomelm"
dynamic = ["version", "readme", "dependencies"]
description = "A proteome-scale language model for fast prediction of protein-protein interactions and gene essentiality across taxa"
authors = [
    { name = "Cyril Malbranke", email = "cyril.malbranke@epfl.ch" },
    { name = "Gionata Paolo Zalaffi" },
    { name = "Anne-Florence Bitbol" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "protein language model",
    "protein-protein interactions",
    "gene essentiality",
    "proteomics",
    "bioinformatics",
    "transformer",
    "deep learning",
    "computational biology",
]

[project.urls]
Homepage = "https://github.com/Bitbol-Lab/ProteomeLM"
"Bug Tracker" = "https://github.com/Bitbol-Lab/ProteomeLM/issues"
"Source Code" = "https://github.com/Bitbol-Lab/ProteomeLM"
Paper = "https://www.pnas.org/doi/10.1073/pnas.2524201123"

[project.optional-dependencies]
gpu = ["flash-attn>=2.0.0"]
notebooks = ["ipython>=8.0.0", "jupyter>=1.0.0", "ipywidgets>=8.0.0"]
# Extra deps of the research scripts under experiments/ (not part of the package):
# seaborn/scipy/networkx/pillow for experiments/examples and hpi, datasets for
# experiments/hpi/5_hf_benchmark.py.
# experiments/essentiality also needs the external binaries mmseqs and NCBI `datasets`.
experiments = ["seaborn>=0.12.0", "scipy>=1.9.0", "networkx>=2.8", "pillow>=9.0.0", "datasets>=2.0.0",
               "gdown>=4.7", "dadapy>=0.3", "ncbi-taxonomist>=1.2", "openpyxl>=3.1"]
# Used by the PPI notebook's Colab setup cell. Colab already ships Jupyter and
# ipywidgets; this only keeps pip on the ESM-C API the code is written for
# (esm 3.4+ requires torch 2.11 / transformers 4.57 and changes the ESMC API).
colab = ["esm>=3.2.1,<3.3"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "flake8>=6.0.0"]

[project.scripts]
proteomelm-train = "proteomelm.cli:train_cli"

[tool.setuptools.packages.find]
exclude = ["experiments*", "notebooks*", "tests*", "docs*"]

[tool.setuptools.dynamic]
version = { attr = "proteomelm.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
